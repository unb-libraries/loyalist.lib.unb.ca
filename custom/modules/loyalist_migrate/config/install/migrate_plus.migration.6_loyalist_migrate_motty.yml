id: 6_loyalist_migrate_motty
label: 'Loyalist Motty Records'

source:
  plugin: motty_item
  key: migratemotty
  keys:
    - nid

process:
  created: created
  changed: changed

  title:
    -
      plugin: callback
      callable: trim
      source: title

  field_motty_event_date/value:
    -
      plugin: format_date
      source: field_event_date_value
      from_format: 'Y-m-d H:i:s'
      to_format: 'Y-m-d\TH:i:s'

  field_motty_event_type:
    -
      plugin: entity_generate
      source: event_type
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: motty_event_types
      value_key: name

  field_motty_event_location:
    -
      plugin: entity_generate
      source: event_location
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: motty_locations
      value_key: name

  field_motty_first_name:
    -
      plugin: callback
      callable: trim
      source: field_first_name_value

  field_motty_last_name:
    -
      plugin: callback
      callable: trim
      source: field_last_name_value

  field_motty_sort_name:
    -
      plugin: callback
      callable: trim
      source: field_sort_name_value

  field_motty_details:
    -
      plugin: callback
      callable: trim
      source: field_details_value

  field_motty_sex:
    -
      plugin: callback
      callable: trim
      source: field_sex_value

  field_motty_notes:
    -
      plugin: callback
      callable: trim
      source: field_notes_value

destination:
  plugin: 'entity:node'
  default_bundle: motty_record_entry
